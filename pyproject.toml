[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blongus"
version = "0.2.1"
description = "Generates a nonsense word from three line-delimited dictionary files."
requires-python = ">=3.8"

[project.scripts]
blongus = "blongus:main"

[tool.setuptools]
py-modules = ["blongus"]

